# Example only — create this with your real values (or use SealedSecrets /
# ExternalSecrets). Do not commit real tokens.
#
#   plugin.token: shared secret the ApplicationSet controller uses to call
#                 this plugin (any random string, e.g. `openssl rand -hex 32`)
#   gitlab.token: GitLab personal/group access token with `read_repository`
#                 (or at least `read_api`) scope
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-tag-plugin-secret
  namespace: argocd
  labels:
    # Required so the ApplicationSet controller may read the plugin token.
    app.kubernetes.io/part-of: argocd
stringData:
  plugin.token: VERYSECRET
  gitlab.token: SUPERSECRET
