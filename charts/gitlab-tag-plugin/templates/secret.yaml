{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "gitlab-tag-plugin.secretName" . }}
{{- $pluginToken := .Values.secret.pluginToken }}
{{- if not $pluginToken }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data .Values.secret.pluginTokenKey) }}
{{- $pluginToken = index $existing.data .Values.secret.pluginTokenKey | b64dec }}
{{- else }}
{{- $pluginToken = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitlab-tag-plugin.labels" . | nindent 4 }}
    # Required so the ApplicationSet controller may read the plugin token.
    app.kubernetes.io/part-of: argocd
type: Opaque
data:
  {{ .Values.secret.gitlabTokenKey }}: {{ required "secret.gitlabToken is required (or set secret.existingSecret)" .Values.secret.gitlabToken | b64enc | quote }}
  {{ .Values.secret.pluginTokenKey }}: {{ $pluginToken | b64enc | quote }}
{{- end }}
